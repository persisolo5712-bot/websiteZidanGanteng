<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;700&family=Caveat:wght@600&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;700&family=Caveat:wght@600&display=swap"></noscript>
<link rel="stylesheet" href="css/dasar.css">
<link rel="stylesheet" href="css/background.css">
<title>Make a wish 🎈</title>
<link rel="stylesheet" href="css/harapan.css">
<link rel="prefetch" href="surat.html">
<link rel="prefetch" href="css/surat.css">
<link rel="prefetch" href="js/surat.js">
</head>
<body data-page="7">
<button class="kembali" data-ke="hadiah.html">‹ kembali</button>
<div id="langit" aria-hidden="true"></div>
<main class="page">
  <section class="card harapan">
    <i class="tape t1"></i><i class="tape t2"></i>
    <p class="eyebrow">✦ make a wish ✦</p>
    <h2>Tulis satu harapan buat tahun ini</h2>
    <p class="sub">nanti diterbangin pakai balon 🎈 (cuma kamu yang lihat)</p>
    <div class="tulis">
      <input id="wish" maxlength="48" placeholder="aku berharap…" autocomplete="off" aria-label="Harapan kamu">
      <button class="btn" id="kirim">🎈 Terbangkan</button>
    </div>
    <p class="komentar" id="info">&nbsp;</p>
    <button class="cta" id="lanjut" data-ke="surat.html" hidden>✉️ Lanjut ke suratnya</button>
  </section>
</main>
<script src="js/config.js"></script>
<script src="js/dasar.js"></script>
<script src="js/bg/mulai.js"></script>
<script src="js/harapan.js"></script>
</body>
</html>
